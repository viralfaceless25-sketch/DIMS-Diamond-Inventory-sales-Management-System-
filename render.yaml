services:
  - type: web
    name: maitri-inventory-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_PROVIDER
        value: supabase
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://maitri-inventory-web.onrender.com

  - type: web
    name: maitri-inventory-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    autoDeployTrigger: commit
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://maitri-inventory-api.onrender.com
